name: 【Repobot】Create Release from Any Branch
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: '请输入要发布的目标分支名 (例如: v26.7.28 或 master)'
        required: true
        type: string
        default: 'main'
      version_tag:
        description: '请输入要创建的 Release Tag (例如: v26.7.28)'
        required: true
        type: string
      release_title:
        description: '请输入 Release 标题 (例如: Release v26.7.28)'
        required: true
        type: string
        default: 'Xray-core'
      prerelease:
        description: '是否标记为 Pre-release (预发布)'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Sync release.yml from master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout origin/master -- .github/workflows/release.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync release.yml from master before release [skip ci]"
          git push origin HEAD:refs/heads/${{ inputs.target_branch }}

      - name: Ensure assets cache is ready before release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const { owner, repo } = context.repo;
            const branch = '${{ inputs.target_branch }}';

            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo });
            const assetsWorkflow = workflows.data.workflows.find(
              w => w.path.endsWith('scheduled-assets-update.yml')
            );
            if (!assetsWorkflow) {
              core.warning('未找到 scheduled-assets-update.yml，跳过预热缓存。');
              return;
            }

            const beforeTime = new Date().toISOString();

            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: assetsWorkflow.id,
              ref: branch
            });
            console.log(`已触发 ${assetsWorkflow.path}，等待其完成...`);

            let targetRun = null;
            for (let i = 0; i < 20; i++) {
              await new Promise(r => setTimeout(r, 15000));
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                workflow_id: assetsWorkflow.id,
                branch,
                event: 'workflow_dispatch',
                per_page: 5
              });
              targetRun = runs.data.workflow_runs.find(
                run => new Date(run.created_at) >= new Date(beforeTime)
              );
              if (targetRun) {
                console.log(`找到运行 #${targetRun.run_number}，状态: ${targetRun.status}`);
                if (targetRun.status === 'completed') break;
              } else {
                console.log(`第 ${i + 1} 次轮询，暂未发现新的运行...`);
              }
            }

            if (!targetRun) {
              core.warning('未能在等待时间内找到对应运行，继续后续流程，但缓存可能仍未就绪。');
            } else if (targetRun.status !== 'completed') {
              core.warning(`资源更新流程仍未完成（状态: ${targetRun.status}），继续后续流程。`);
            } else if (targetRun.conclusion !== 'success') {
              core.warning(`资源更新流程结束但未成功（结论: ${targetRun.conclusion}），继续后续流程。`);
            } else {
              console.log('资源缓存已就绪。');
            }

      - name: Tag and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ inputs.version_tag }}"
          git push origin "refs/tags/${{ inputs.version_tag }}" --force

      - name: Delete existing release if present
        run: gh release delete "${{ inputs.version_tag }}" --yes --cleanup-tag=false || true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          name: ${{ inputs.release_title }}
          target_commitish: ${{ inputs.target_branch }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_PAT }}
